<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活動作圖鑑</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f8f3e7; color: #293d34; font: 16px system-ui, sans-serif; }
header, main { width: min(1060px, 100% - 32px); margin: auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 0; }
h1 { font-size: clamp(1.3rem, 5vw, 2rem); margin: 0; }
button, select { font: inherit; }
button { cursor: pointer; touch-action: manipulation; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid #25765c; outline-offset: 4px; }
.control { border: 1px solid #b8c8b8; border-radius: 12px; background: #fffef9; padding: 9px 12px; }
.control:disabled { opacity: .55; cursor: default; }
main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 225px), 1fr)); gap: 14px; padding-bottom: 24px; }
.card { display: grid; justify-items: center; align-content: center; min-height: 210px; padding: 12px; border-radius: 24px; background: #fffdf7; box-shadow: 0 2px 8px #3b4f3210; }
.card:nth-child(4n+2) { background: #edf6ed; }
.card:nth-child(4n+3) { background: #edf5fb; }
.card:nth-child(4n) { background: #fff1e7; }
.card h2 { margin: 10px 0 0; font-size: 1.02rem; }
.scene { position: relative; display: grid; place-items: center; width: 100%; height: 150px; isolation: isolate; }
.object { border: 0; background: none; padding: 0; display: grid; place-items: center; z-index: 1; }
.frame { position: relative; display: block; width: 102px; height: 135px; border: 7px solid #74492f; border-radius: 7px 7px 0 0; background: linear-gradient(#9cdbf2 56%, #8fbc73 57%, #759f5e 72%, #d4bd92 73%); }
.frame::after { content: ""; position: absolute; inset: 0; background: #bd7f51; box-shadow: inset 0 0 0 5px #a46643; transform-origin: left; }
.frame::before { content: ""; position: absolute; z-index: 1; width: 10px; height: 10px; border-radius: 50%; background: #ffe09a; top: 53%; right: 8px; }
.open .frame:not(.window)::after { right: 56%; clip-path: polygon(0 0, 100% 15%, 100% 85%, 0 100%); background: linear-gradient(90deg, #a46643 0 12%, #bd7f51 12% 90%, #925738 90%); box-shadow: none; }
.open .frame:not(.window)::before { left: 29%; right: auto; width: 7px; height: 8px; }
.window { width: 134px; height: 101px; border: 7px solid #596e74; border-radius: 8px; box-shadow: 0 5px #91a3a3; }
.window::after { background: linear-gradient(90deg, #a5ceda 47%, #596e74 48% 53%, #a5ceda 54%); box-shadow: inset 0 0 0 3px #728e97; }
.window::before { display: none; }
.open .window::after { transform: scaleX(.49); }
.effect { position: absolute; pointer-events: none; opacity: 0; }
.lamp { position: relative; display: block; width: 72px; height: 86px; margin-bottom: 22px; border: 5px solid #73654f; border-radius: 50% 50% 42% 42%; background: #e4dfd6; }
.lamp::after { content: ""; position: absolute; top: 69px; left: 14px; width: 34px; height: 30px; border-radius: 4px 4px 12px 12px; background: repeating-linear-gradient(#6f7774 0 5px,#a3aaa6 5px 8px); }
.lit .lamp { background: #ffe680; }
.glow { width: 144px; height: 144px; background: radial-gradient(#ffe264 25%, #ffe26400 72%); }
.lit .glow, .flowing .stream { opacity: 1; }

.faucet { position: relative; display: block; width: 104px; height: 64px; border-top: 17px solid #6e8a92; border-right: 17px solid #6e8a92; border-radius: 4px 29px 0 0; margin-top: 10px; }
.faucet::before { content: ""; position: absolute; width: 49px; height: 12px; border-radius: 8px; background: #4e707a; left: 16px; top: -32px; box-shadow: 0 11px 0 -3px #65848d; }
.faucet::after { content: ""; position: absolute; width: 39px; height: 21px; border-radius: 6px; background: #8ca4aa; left: -5px; top: -19px; }
.stream { top: 111px; left: calc(50% + 37px); width: 12px; height: 38px; border-radius: 10px; background: repeating-linear-gradient(#83d2f5 0 12px,#38a4d9 12px 20px);  }
.flowing .stream { animation: water .4s linear infinite; }
@keyframes water { to { background-position-y: 20px; } }
.food { position: relative; display: block; width: min(153px, 39vw); aspect-ratio: 1; --remaining: 1; background: #fff; border-radius: 12px; overflow: hidden; }
.food img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
.food .full-food { z-index: 2; }
.food[data-stage]:not([data-stage="0"]) .full-food { visibility: hidden; }
.bowl-inside { position: absolute; left: 3%; top: 29%; width: 94%; height: 30%; border: 3px solid #741e0a; border-radius: 50%; background: radial-gradient(ellipse at 50% 81%, #fff4e7 20%, #e9b58e 75%); }
.rice-contents {
  clip-path: polygon(7% 44%, 10% 35%, 16% 28%, 23% 22%, 32% 15%, 41% 11%, 48% 7%, 53% 8%, 58% 8%, 61% 11%, 67% 12%, 72% 17%, 78% 18%, 83% 23%, 87% 29%, 92% 35%, 93% 46%, 83% 53%, 69% 56%, 50% 57%, 31% 56%, 17% 53%);
  transform-origin: 50% 56%;
  transform: translateY(calc((1 - var(--remaining)) * 12%)) scale(var(--remaining));
  transition: transform .26s ease-out;
}
.bowl-front { clip-path: polygon(0 45%, 5% 41%, 8% 45%, 11% 49%, 17% 52%, 24% 54.5%, 33% 56.2%, 42% 57.3%, 50% 57.5%, 58% 57.3%, 67% 56.2%, 76% 54.5%, 83% 52%, 89% 49%, 92% 45%, 95% 41%, 100% 45%, 100% 100%, 0 100%); }
.glass { position: absolute; inset: 14% 15% 2%; background: linear-gradient(90deg, #c4dce1 0%, #f8ffff 20%, #ddebeb 48%, #f7ffff 77%, #b8d2d7 100%); clip-path: polygon(0 0,100% 0,84% 88%,82% 94%,76% 98%,67% 100%,33% 100%,24% 98%,18% 94%,16% 88%); }
.glass-rim { position: absolute; left: 15%; top: 3%; width: 70%; height: 26%; border: 3px solid #7e9b9f; border-radius: 50%; background: linear-gradient(#f8ffff90,#b5d3d633); }
.cola-contents { clip-path: inset(calc(15% + (1 - var(--remaining)) * 73%) 0 11%); transition: clip-path .26s ease-out; }
.cola[data-stage="6"] .cola-contents { clip-path: inset(89% 0 11%); }
.pearl { position: absolute; width: 27%; height: 27%; border-radius: 50%; background-image: var(--pearls); background-size: 361% 361%; background-position: 49.5% 19%; }
.pearl:nth-child(1) { left: 36%; top: 16%; }
.pearl:nth-child(2) { left: 20%; top: 30%; }
.pearl:nth-child(3) { left: 53%; top: 32%; }
.pearl:nth-child(4) { left: 6%; top: 51%; }
.pearl:nth-child(5) { left: 65%; top: 48%; }
.pearl:nth-child(6) { left: 26%; top: 56%; }
.pearl:nth-child(7) { left: 48%; top: 60%; }
.pearl:nth-child(8) { left: 37%; top: 69%; }
.pearls[data-stage="8"] .pearl { visibility: hidden; }

dialog { max-width: min(430px, 100% - 28px); border: 1px solid #b8c8b8; border-radius: 20px; padding: 22px; color: inherit; }
dialog::backdrop { background: #263b3477; }
dialog h2 { margin: 0 0 16px; }
dialog label, dialog select { display: block; }
dialog select { width: 100%; margin: 6px 0 12px; padding: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 7px; }
#status { min-height: 1.5em; }
@media (max-width: 530px) {
  main { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .card { min-height: 175px; padding: 4px; }
  .scene { height: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  .flowing .stream { animation: none; }
  .rice-contents, .cola-contents { transition: none; }
}
</style>
</head>
<body>
<header>
  <h1>生活動作圖鑑</h1>
  <button class="control" id="settings">家長錄音</button>
</header>
<main aria-label="生活動作卡片"></main>
<dialog aria-labelledby="settings-title">
  <h2 id="settings-title">家長錄音</h2>
  <label for="phrase">選擇動作詞</label>
  <select id="phrase"></select>
  <div class="controls">
    <button class="control" id="record">開始錄音</button>
    <button class="control" id="preview">試聽</button>
    <button class="control" id="save" disabled>套用錄音</button>
    <button class="control" id="reset" disabled>恢復預設</button>
    <button class="control" id="close">關閉</button>
  </div>
  <p id="status" role="status"></p>
</dialog>
<script src="life-actions.js"></script>
</body>
</html>
