<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff7e8">
<link rel="icon" type="image/png" href="精靈球.png">
<link rel="apple-touch-icon" href="精靈球.png">
<title>符號宇宙｜看見符號，聽懂世界</title>
<style>
:root{--bg:#fff7e8;--ink:#30241d;--accent:#f1b95d;--card:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
button{font:inherit}
body{touch-action:manipulation;user-select:none}

.screen{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;display:none;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));overflow:hidden}
.screen.active{display:flex}

/* 首頁四宮格 */
#home{align-items:center;justify-content:center;background:linear-gradient(180deg,#fffaf2 0%,#fff4dc 100%)}
.grid{width:min(92vw,82vh,760px);width:min(92vw,82dvh,760px);aspect-ratio:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(10px,2.2vmin,18px)}
.cat{border:0;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;cursor:pointer;box-shadow:0 14px 32px rgba(80,55,30,.12);transition:transform .12s ease,box-shadow .12s ease}
.cat:active{transform:scale(.965);box-shadow:0 8px 18px rgba(80,55,30,.10)}
.cat-icon{font-size:clamp(72px,17vw,138px);font-weight:900;line-height:1}
.cat-name{font-size:clamp(24px,5.8vw,40px);font-weight:900;white-space:nowrap;letter-spacing:.03em}
.cat.bopomofo{background:#ffe9c8}
.cat.letters{background:#dff1ff}
.cat.numbers{background:#e7f4dc}
.cat.pokemon{background:#f5e4ff}
.cat.bopomofo .cat-icon{color:#b76d00}
.cat.letters .cat-icon{color:#2c6fa3}
.cat.numbers .cat-icon{color:#4f7a32}
.cat.pokemon .cat-icon{filter:drop-shadow(0 5px 5px rgba(0,0,0,.08))}
.cat-icon-img{width:clamp(82px,18vw,144px);height:clamp(82px,18vw,144px);object-fit:contain;display:block}

/* 學習卡 */
#learn{align-items:center;justify-content:center}
.card{width:min(94vw,760px);height:min(88vh,980px);height:min(88dvh,980px);background:#fff;border-radius:34px;box-shadow:0 16px 52px rgba(70,45,20,.13);display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden;cursor:pointer}
.visual{display:flex;align-items:center;justify-content:center;min-height:0;padding:34px;background:linear-gradient(180deg,#fff,#fffaf0)}
.big-text{font-size:clamp(180px,48vw,390px);font-weight:900;line-height:1;letter-spacing:0}
.big-text.letter{font-family:Arial,sans-serif}
.big-text.number{font-family:Arial,sans-serif}
.card-img{width:100%;height:100%;max-width:92%;max-height:92%;object-fit:contain;pointer-events:none}
.pokemon-img{filter:drop-shadow(0 18px 18px rgba(0,0,0,.08))}
.label{text-align:center;padding:18px 16px 28px;font-size:clamp(46px,10vw,84px);font-weight:900;letter-spacing:.08em;background:#fff;pointer-events:none}
.label.pokemon-label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px 20px;letter-spacing:.04em}
.pokemon-name{font-size:clamp(36px,8vw,66px);line-height:1.12}
.pokemon-zhuyin{font-size:clamp(19px,4.2vw,32px);font-weight:800;line-height:1.3;letter-spacing:.08em;color:#795b44}

.back{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));z-index:20;border:0;background:#fff;border-radius:18px;width:66px;height:58px;font-size:30px;font-weight:900;box-shadow:0 7px 20px rgba(0,0,0,.12);cursor:pointer}
.counter{position:absolute;top:max(26px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:18px;font-weight:900;color:rgba(48,36,29,.42);pointer-events:none}
.hint{position:absolute;bottom:max(7px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:13px;color:rgba(48,36,29,.35);white-space:nowrap;pointer-events:none}
.pop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;opacity:0;pointer-events:none}
.pop.go{animation:pop .42s ease}
@keyframes pop{0%{opacity:0;transform:scale(.75)}35%{opacity:.8;transform:scale(1.05)}100%{opacity:0;transform:scale(1.25)}}

@media(max-width:520px){.cat{border-radius:clamp(20px,6vw,26px);padding:clamp(8px,2.5vw,12px);gap:clamp(7px,2vw,12px)}.cat-icon{font-size:clamp(52px,17vw,82px)}.cat-icon-img{width:clamp(58px,18vw,88px);height:clamp(58px,18vw,88px)}.cat-name{font-size:clamp(20px,5.8vw,28px)}.card{border-radius:28px}.label{padding:12px 12px 22px}}
@media(max-height:520px) and (orientation:landscape){.grid{width:min(78vw,78dvh,620px)}.cat{border-radius:20px;padding:8px;gap:5px}.cat-icon{font-size:clamp(40px,13vh,66px)}.cat-icon-img{width:clamp(44px,14vh,70px);height:clamp(44px,14vh,70px)}.cat-name{font-size:clamp(17px,4.5vh,24px)}.hint{display:none}}
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="grid" id="categoryGrid">
    <button class="cat bopomofo" data-cat="bopomofo"><div class="cat-icon">ㄅ</div><div class="cat-name">注音符號</div></button>
    <button class="cat letters" data-cat="letters"><div class="cat-icon" style="font-family:Arial,sans-serif">ABC</div><div class="cat-name">英文字母</div></button>
    <button class="cat numbers" data-cat="numbers"><div class="cat-icon" style="font-family:Arial,sans-serif">123</div><div class="cat-name">數字</div></button>
    <button class="cat pokemon" data-cat="pokemon"><div class="cat-icon"><img class="cat-icon-img" src="精靈球.png" alt="精靈球"></div><div class="cat-name">寶可夢</div></button>
  </div>
</section>

<section id="learn" class="screen">
  <button class="back" id="backBtn" aria-label="回首頁">⌂</button>
  <div class="counter" id="counter"></div>
  <div class="card" id="card">
    <div class="visual" id="visual"></div>
    <div class="label" id="label"></div>
  </div>
  <div class="pop" id="pop">🔊</div>
  <div class="hint">點畫面發音・左右滑動換下一張</div>
</section>

<script src="pokemon-zhuyin.js"></script>
<script>
const DATA = {
  bopomofo: [
    ["ㄅ","bo"],["ㄆ","po"],["ㄇ","mo"],["ㄈ","fo"],["ㄉ","de"],["ㄊ","te"],["ㄋ","ne"],["ㄌ","le"],
    ["ㄍ","ge"],["ㄎ","ke"],["ㄏ","he"],["ㄐ","ji"],["ㄑ","qi"],["ㄒ","xi"],["ㄓ","zhi"],["ㄔ","chi"],
    ["ㄕ","shi"],["ㄖ","ri"],["ㄗ","zi"],["ㄘ","ci"],["ㄙ","si"],["ㄧ","i"],["ㄨ","u"],["ㄩ","yu"],
    ["ㄚ","a"],["ㄛ","o"],["ㄜ","e"],["ㄝ","eh"],["ㄞ","ai"],["ㄟ","ei"],["ㄠ","ao"],["ㄡ","ou"],
    ["ㄢ","an"],["ㄣ","en"],["ㄤ","ang"],["ㄥ","eng"],["ㄦ","er"]
  ].map(([display,file],i)=>({display,label:display,speak:display,img:`output/zhuyin/${String(i+1).padStart(2,"0")}_${file}.webp`,lang:"zh-TW",kind:"bopomofo"})),

  letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map((x,i)=>{
    const display = x + x.toLowerCase();
    return {display,label:display,speak:x,img:`output/alphabet/${String(i+1).padStart(2,"0")}_${display}.webp`,lang:"en-US",kind:"letter"};
  }),

  numbers: ["零","一","二","三","四","五","六","七","八","九","十"]
    .map((speak,i)=>({display:String(i),label:String(i),speak,img:`output/numbers/${String(i+1).padStart(2,"0")}_${i}.webp`,lang:"zh-TW",kind:"number"})),

  pokemon: (window.POKEMON_ZHUYIN || [])
    .slice()
    .sort((a,b)=>a.id-b.id)
    .map(x=>({
      id:x.id,
      label:x.name,
      zhuyin:x.zhuyinText,
      speak:x.name,
      img:`output/pokemon/${String(x.id).padStart(4,"0")}.webp`,
      lang:"zh-TW",
      kind:"pokemon"
    }))
};

const home = document.getElementById("home");
const learn = document.getElementById("learn");
const visual = document.getElementById("visual");
const label = document.getElementById("label");
const card = document.getElementById("card");
const counter = document.getElementById("counter");
const pop = document.getElementById("pop");
let category = null;
let index = 0;

function openCategory(cat){
  category = cat;
  index = 0;
  home.classList.remove("active");
  learn.classList.add("active");
  renderCard();
}

function goHome(){
  speechSynthesis.cancel();
  learn.classList.remove("active");
  home.classList.add("active");
  category = null;
}

function renderCard(){
  const list = DATA[category];
  const item = list[index];
  counter.textContent = `${index+1} / ${list.length}`;
  label.classList.toggle("pokemon-label", item.kind === "pokemon");

  visual.replaceChildren();
  const img = document.createElement("img");
  img.className = `card-img${item.kind === "pokemon" ? " pokemon-img" : ""}`;
  img.src = item.img;
  img.alt = item.label;
  img.draggable = false;
  visual.appendChild(img);

  if(item.kind === "pokemon"){
    label.replaceChildren();
    const name = document.createElement("div");
    name.className = "pokemon-name";
    name.textContent = item.label;
    const zhuyin = document.createElement("div");
    zhuyin.className = "pokemon-zhuyin";
    zhuyin.textContent = item.zhuyin;
    label.append(name, zhuyin);
  } else {
    label.textContent = item.label;
  }
}

function speakCurrent(){
  if(!category) return;
  const item = DATA[category][index];
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(item.speak);
  u.lang = item.lang;
  u.rate = category === "letters" ? 0.72 : 0.78;
  u.pitch = 1.05;
  speechSynthesis.speak(u);
  pop.classList.remove("go");
  void pop.offsetWidth;
  pop.classList.add("go");
}

function move(dir){
  if(!category) return;
  const list = DATA[category];
  index = (index + dir + list.length) % list.length;
  renderCard();
  speakCurrent();
}

document.getElementById("categoryGrid").addEventListener("click",e=>{
  const btn = e.target.closest("button[data-cat]");
  if(btn) openCategory(btn.dataset.cat);
});
document.getElementById("backBtn").addEventListener("click",e=>{e.stopPropagation();goHome();});
card.addEventListener("click",speakCurrent);

let sx=0,sy=0;
card.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
card.addEventListener("touchend",e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)) move(dx<0?1:-1);
},{passive:true});

window.addEventListener("keydown",e=>{
  if(!category) return;
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowLeft") move(-1);
  if(e.key===" "||e.key==="Enter") speakCurrent();
  if(e.key==="Escape") goHome();
});
</script>
</body>
</html>
